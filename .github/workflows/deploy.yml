name: Secure GitOps Pipeline

on:
  push:
    branches: [main]

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login \
          --username AWS \
          --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

    - name: Build Docker image
      run: |
        docker build -t secure-app ./app

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: secure-app:latest
        format: table
        exit-code: 0
        severity: HIGH,CRITICAL

    - name: Push to ECR
      run: |
        docker tag secure-app:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/secure-app:latest
        docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/secure-app:latest

    - name: Deploy to EKS
      run: |
        aws eks update-kubeconfig --name gitops-cluster --region us-east-1
        kubectl apply -f k8s/
